name: Actualizar estadísticas del perfil

on:
  schedule:
    - cron: "17 6 * * *" # todos los días a las 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - scripts/generate_stats.py
      - .github/workflows/stats.yml

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar SVG
        env:
          # Opcional: crea el secreto STATS_TOKEN (PAT con read:user) para incluir contribuciones privadas.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Guardar cambios
        run: |
          if git diff --quiet -- assets; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "chore: actualizar estadísticas del perfil"
          git push
